name: Build and publish KGUI Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Checkout official KodeOS sources
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: 9bcfdb71b763ee7b5c14106358643ea611fc97db
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned SDK revision
        shell: bash
        run: |
          expected="1841cc8c13d4b2e3e4d7288b40cdac5de207a133"
          actual="$(git -C upstream/sdk rev-parse HEAD)"
          echo "Expected SDK: $expected"
          echo "Actual SDK:   $actual"
          test "$actual" = "$expected"

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Patch the upstream simulator for browser event loop and SDL2
        run: python3 "$GITHUB_WORKSPACE/patches/emscripten.py" upstream/sdk

      - name: Configure WebAssembly build
        run: |
          emcmake cmake -S upstream/components/kgui/sim -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXECUTABLE_SUFFIX=.html

      - name: Compile official KGUI simulator
        run: cmake --build build --parallel 2

      - name: Prepare single-page KGUI web emulator
        shell: bash
        run: |
          mkdir -p dist
          cp build/kgui_sim.html dist/index.html
          cp build/kgui_sim.js dist/
          cp build/kgui_sim.wasm dist/
          touch dist/.nojekyll

      - name: Make KGUI emulator fit mobile browsers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("dist/index.html")
          html = page.read_text()
          html = html.replace("<html lang=en-us>", '<html lang="fr">', 1)
          html = html.replace("<title>Emscripten-Generated Code</title>",
                              "<title>Similateur Kode Dot — KGUI</title>", 1)
          if 'name="viewport"' not in html:
              mobile = """<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#10151f">
          <style>
            html, body { margin: 0; min-height: 100%; background: #10151f; color: #edf3fc; }
            body { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; padding: 12px;
                   display: flex; flex-direction: column; align-items: center; justify-content: center;
                   overflow: auto; }
            #emscripten_logo, #controls, #output { display: none !important; }
            #status { color: #dce7f7; margin: 8px auto; text-align: center; }
            .emscripten_border { width: 100%; border: 0; display: flex; justify-content: center; }
            canvas.emscripten {
              display: block; width: min(602px, calc(100vw - 24px), calc((100dvh - 24px) * 602 / 979));
              height: auto; aspect-ratio: 602 / 979; object-fit: contain;
              background: #000; touch-action: none;
            }
          </style>
          """
              html = html.replace("</head>", mobile + "</head>", 1)
          interaction = """<script>
          (() => {
            const attach = () => {
              const canvas = document.querySelector("canvas.emscripten");
              if (!canvas) return;
              canvas.tabIndex = 0;
              canvas.setAttribute("aria-label", "Simulateur Kode Dot. Flèches : pavé directionnel ; Entrée : bouton TOP ; Échap : bouton BOT.");
              canvas.addEventListener("pointerdown", () => canvas.focus({ preventScroll: true }));
              window.addEventListener("keydown", (event) => {
                if (document.activeElement !== canvas) return;
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
                  event.preventDefault();
                }
              }, { passive: false });
            };
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", attach);
            else attach();
          })();
          </script>
          """
          html = html.replace("</body>", interaction + "</body>", 1)
          page.write_text(html)
          assert 'name="viewport"' in html
          assert "aspect-ratio: 602 / 979" in html
          print(f"Mobile KGUI viewport configured: {page.stat().st_size} bytes")
          PY

      - name: Write source manifest
        shell: bash
        run: |
          cat > dist/versions.json <<EOF
          {
            "project": "similateur-kd",
            "kodeos_source_commit": "9bcfdb71b763ee7b5c14106358643ea611fc97db",
            "kodeos_sdk_commit": "1841cc8c13d4b2e3e4d7288b40cdac5de207a133",
            "renderer": "upstream KGUI/KUI with LVGL, compiled to WebAssembly"
          }
          EOF
          cat dist/versions.json

      - name: Validate single-page web emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/versions.json").read_text())
          assert manifest["kodeos_sdk_commit"] == "1841cc8c13d4b2e3e4d7288b40cdac5de207a133"
          assert manifest["renderer"].startswith("upstream KGUI/KUI")
          for name in ("index.html", "kgui_sim.js", "kgui_sim.wasm", "versions.json"):
              path = Path("dist") / name
              assert path.is_file() and path.stat().st_size > 0, name
              print(f"OK {path} ({path.stat().st_size} bytes)")
          html = Path("dist/index.html").read_text()
          assert 'name="viewport"' in html
          assert "602 / 979" in html
          assert "kgui_sim.js" in html
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web emulator
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish web emulator
        id: deployment
        uses: actions/deploy-pages@v4
